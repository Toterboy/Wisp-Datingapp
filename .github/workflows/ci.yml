name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Java 17 (Android-Toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      # pubspec.yaml bindet .env als Asset ein - ohne Datei schlägt der
      # Asset-Build von flutter test fehl.
      - name: .env aus Beispiel erzeugen
        run: cp .env.example .env

      - name: Dependencies laden
        run: flutter pub get

      - name: Analyze (muss fehlerfrei sein)
        run: flutter analyze --fatal-infos

      - name: Tests
        run: flutter test

  fdroid-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Java 17 (Android-Toolchain)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter installieren
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: .env aus Beispiel erzeugen
        run: cp .env.example .env

      - name: Dependencies laden
        run: flutter pub get

      # Hält die Google-freie Variante dauerhaft kompilierbar
      - name: F-Droid Debug-Build (ohne Firebase)
        run: >
          flutter build apk --debug
          --flavor fdroid --dart-define=FDROID=true
