name: wisp
description: Eine moderne, datenschutzfreundliche Dating-App mit Blind Mode (PersÃ¶nlichkeit zuerst).
publish_to: 'none'
version: 0.7.1+18

environment:
  sdk: ^3.10.0
  flutter: ^3.35.0

dependencies:
  flutter:
    sdk: flutter
  # Material-/Widgets-/Cupertino-Localizations fuer de/en: Ohne diese
  # Delegates laedt Flutter bei locale 'de' KEIN MaterialLocalizations
  # ("No MaterialLocalizations found" - AppBar/PopupMenus crashten).
  flutter_localizations:
    sdk: flutter
  # cupertino_icons: Wird von keinem Code direkt genutzt, aber mindestens
  # ein Paket importiert flutter/cupertino.dart transitiv - der Icon-Tree-
  # Shaker erwartet dann den Font ("Expected to find fonts for ...").
  # Mit dieser Dependency ist die Font-Referenz aufgeloest; ungenutzte
  # Glyphen werden beim Release ohnehin weggeschnitten.
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^17.3.0

  # Lokale, sichere Datenspeicherung (Einstellungen, Profil, Auth-Token)
  shared_preferences: ^2.2.3

  # SchÃ¶ne Icons & Utilities
  flutter_svg: ^2.0.10
  # 0.20.2 ist von flutter_localizations (Flutter SDK) gepinnt - eine
  # hoehere Constraint wuerde die Abhaengigkeitsaufloesung brechen.
  intl: ^0.20.2
  share_plus: ^13.2.1

  # App-Informationen fÃ¼r Bug-Reports (Version)
  package_info_plus: ^10.0.0

  # Ã–ffnen externer Links (GitHub Issues)
  url_launcher: ^6.3.1

  # Bildauswahl fÃ¼r Bug-Reports
  image_picker: ^1.1.2

  # Firebase fÃ¼r Server-Zeit & Cloud-Functions
  # ENTFERNT: Wird nicht mehr benÃ¶tigt, ersetzt durch Supabase.

  # === NEUE DEPENDENCIES FÃœR SICHERHEITS-FEATURES ===

  # E2E-VerschlÃ¼sselung (Signal Protocol)
  libsignal_protocol_dart: ^0.8.2

  # WebRTC fÃ¼r P2P-Kommunikation
  flutter_webrtc: ^1.6.0

  # WebSocket fÃ¼r Signaling-Server-Kommunikation
  web_socket_channel: ^3.0.1

  # HTTP-Client fÃ¼r REST-API (mit Zertifikat-Pinning)
  http: ^1.2.1

  # Kryptographische Hash-Funktionen (fÃ¼r Zertifikat-Pinning)
  crypto: ^3.0.5

  # Sichere, verschlÃ¼sselte lokale Speicherung von Tokens (statt SharedPreferences)
  flutter_secure_storage: ^11.0.0

  # Hive fÃ¼r lokale verschlÃ¼sselte Speicherung der Signal-Keys
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Kamera & Video fÃ¼r Verifizierung
  camera: ^0.12.0
  video_player: ^2.9.1

  # Berechtigungen
  permission_handler: ^13.0.1

  # Standort
  geolocator: ^14.0.3

  # Geocoding fÃ¼r Ortserkennung
  geocoding: ^4.0.0

  # Bildverarbeitung fÃ¼r Moderation (Placeholder fÃ¼r ML-Kit)
  image: ^4.2.0

  # Path Provider fÃ¼r Dateipfade
  path_provider: ^2.1.4

  # Benachrichtigungen (Nachrichten, Likes, Matches, Event-Erinnerungen)
  flutter_local_notifications: ^22.1.0

  # EU-Push Ã¼ber Supabase Push (Verarbeitung in eu-central-1, Free Tier).
  # FCM dient nur als Zustell-Transport (kostenloses Firebase-Konto nÃ¶tig).
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # Geplante Benachrichtigungen (Dating-Hour-Erinnerung auch bei
  # geschlossener App)
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Nativer Splash (Preserve/Remove-API wird zur Laufzeit in main.dart genutzt,
  # daher als regulÃ¤re Dependency statt dev_dependency)
  flutter_native_splash: ^2.4.8

  # Crypto fÃ¼r Key-Backup-VerschlÃ¼sselung
  pointycastle: ^4.0.0

  # Supabase fÃ¼r Auth + Datenbank (RLS-abgesichert) + Supabase Push (EU)
  flutter_dotenv: ^6.0.1
  supabase_flutter: ^2.17.1

  # Passkeys (WebAuthn): native Passkey-Dialoge (FaceID/TouchID/Biometrie).
  # Der Plugin-Code lÃ¤uft auf iOS 16+ / Android; es reicht die
  # Plattform-Prompts an Supabase Auth weiter (siehe lib/services/passkey_auth.dart).
  # ACHTUNG: BenÃ¶tigt Flutter 3.35+ / Dart 3.9+ und supabase_flutter mit
  # Passkey-UnterstÃ¼tzung (signInWithPasskey/registerPasskey).
  passkeys: ^2.21.0

  # QR-Code (Profil teilen + Scannen)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  record: ^7.1.1
  just_audio: ^0.10.6
  webview_flutter: ^4.14.1
  image_cropper: ^12.2.1
  unifiedpush: ^6.2.0
  passkeys_doctor: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint-Regeln fÃ¼r sauberen, modernen Code
  flutter_lints: ^6.0.0

  # Code Generation fÃ¼r Hive
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

  # Launcher-Icons aus einem Basis-Bild generieren
  flutter_launcher_icons: ^0.14.4

# Lokale Forks der drei Plugins, die noch kein Built-in Kotlin unterstÃ¼tzen
# (KGP-Warnung beim Build). Die Forks enthalten KEINE KGP-Apply-Zeilen mehr;
# der Flutter-Plugin-Loader wendet KGP dann selbst an (builtInKotlin=false).
dependency_overrides:
  flutter_timezone:
    path: third_party/flutter_timezone
  flutter_webrtc:
    path: third_party/flutter_webrtc
  mobile_scanner:
    path: third_party/mobile_scanner
  # KGP-freier Fork: passkeys_android zieht upstream bedingungslos
  # kotlin-android an (trotz reinem Java-Quellcode) und loest damit die
  # Flutter-KGP-Warnung aus. Siehe third_party/passkeys_android.
  passkeys_android:
    path: third_party/passkeys_android
  # Stub: unifiedpush_linux zieht webpush_encryption -> webcrypto
  # (Native Assets mit CMake-Bedarf) und bricht dadurch Tests/Builds auf
  # Windows. Linux-Desktop ist kein Target - siehe third_party/unifiedpush_linux.
  unifiedpush_linux:
    path: third_party/unifiedpush_linux
  # KGP-freier Fork: unifiedpush_android zieht upstream einen eigenen
  # buildscript-Klasspath (AGP + KGP) -> Flutter-KGP-Warnung.
  # Siehe third_party/unifiedpush_android.
  unifiedpush_android:
    path: third_party/unifiedpush_android

flutter_launcher_icons:
  # Legacy-Android-Icon (mipmap-*): volles Basis-PNG (weisser Hintergrund +
  # Badge) â€“ entspricht exakt der hochgeladenen PNG.
  image_path: "assets/images/wispdating_logo_round.png"
  # iOS-Icon: voll opake 1024er-Variante (Apple maskt selbst, Transparenz
  # ist auf iOS nicht erlaubt).
  image_path_ios: "assets/images/wispdating_logo_round.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Adaptive Icon (Android 8+): weisser Hintergrund (wie im Original-PNG) +
  # transparentes Foreground, in dem das Badge zentriert auf 66 % der
  # Safe-Zone eingebacken ist (generiert via tool/generate_icons.ps1).
  # KEINE hex-Varianten! Die enthalten schwarze RÃ¤nder/Dreiecke.
  adaptive_icon_background: "#390D3C"
  adaptive_icon_foreground: "assets/images/wisp_icon_foreground.png"
  # Safe-Zone steckt bereits im Foreground -> kein zusaetzlicher Inset,
  # sonst wuerde das Badge erneut verkleinert (16 % Default).
  adaptive_icon_foreground_inset: 0
  platforms:
    web:
      generate: false
    windows:
      generate: false
    macos:
      generate: false
    linux:
      generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/wispdating_icon_base.png
    - assets/images/wispdating_logo_round.png
    - assets/images/wispdating_benachrichtigungsicon.png
    - .env

  # Hinweis: In einer echten App wÃ¼rden hier weitere Assets (Bilder, Fonts) registriert.
