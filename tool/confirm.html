<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisp – E-Mail bestätigen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { font-size: 15px; opacity: 0.9; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      background: #E9457B;
      color: #fff;
      padding: 14px 36px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      margin: 8px 0;
      transition: background 0.2s;
    }
    .btn:hover { background: #d13a6b; }
    .btn-outline {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.5);
    }
    .btn-outline:hover { background: rgba(255,255,255,0.1); }
    .hidden { display: none !important; }
    .links { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  </style>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const query = params.toString();

      // Ziel: App öffnen via wisp://confirm?token=...&type=signup
      const appUrl = 'wisp://confirm' + (query ? '?' + query : '');

      // Fallback: zur Supabase-URL, falls App nicht installiert
      const siteUrl = 'https://jftuigjbmmuvrckbchqo.supabase.co';
      const fallbackUrl = siteUrl + '/auth/v1/verify' + (query ? '?' + query : '');

      // Versuche, die App zu öffnen
      function openApp() {
        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('fallback').classList.add('hidden');

        // window.location = appUrl öffnet die App via Custom URL Scheme
        window.location.href = appUrl;

        // Nach 2 Sekunden: Falls die App nicht geöffnet wurde (kein blur),
        // zeigen wir den Fallback an.
        setTimeout(function() {
          if (!document.hidden && document.hasFocus()) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('fallback').classList.remove('hidden');
          }
        }, 2000);
      }

      // Automatisch starten
      openApp();

      // Button-Click
      document.getElementById('retry-btn').addEventListener('click', function(e) {
        e.preventDefault();
        openApp();
      });

      document.getElementById('web-btn').addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = fallbackUrl;
      });
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="logo">💜</div>
    <h1>E-Mail bestätigen</h1>

    <!-- Wird angezeigt während die App geöffnet wird -->
    <div id="loading">
      <p>Deine App wird geöffnet …</p>
    </div>

    <!-- Fallback: App wurde nicht gefunden -->
    <div id="fallback" class="hidden">
      <p>Die Wisp-App konnte nicht geöffnet werden. Du hast sie vielleicht noch nicht installiert.</p>
      <div class="links">
        <a href="#" id="retry-btn" class="btn">App öffnen</a>
        <a href="#" id="web-btn" class="btn btn-outline">Im Browser bestätigen</a>
      </div>
      <p style="font-size:12px;margin-top:16px;opacity:0.7">
        Lade die App herunter, um fortzufahren.
      </p>
    </div>
  </div>
</body>
</html>
