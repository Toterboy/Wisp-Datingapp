# Supabase Projekt-Konfiguration
# Wird vom Supabase CLI und der Plattform für Edge Functions verwendet.
#
# Benötigte Secrets (supabase secrets set ...):
#   WISP_INTERNAL_SECRET     – NEU rotieren (altes war im Repo)! Muss zum
#                              Vault-Secret 'wisp_internal_secret' passen
#                              (Migration 040, Audit K1).
#   INTERNAL_SECRET          – für den internen Aufruf von check-location.
#   FIREBASE_SERVICE_ACCOUNT_JSON – FCM-Push (Service-Account-JSON).
#   BREVO_API_KEY            – Bug-Report-E-Mails (send-bug-report).
#
# TURN wird NICHT genutzt (Betreiber-Entscheidung, keine laufenden Kosten):
# ice-config liefert ausschließlich STUN.

project_id = "jftuigjbmmuvrckbchqo"

# --- Edge Functions mit JWT-Verifikation ---
# Funktionen, die nur von authentifizierten Nutzern aufgerufen werden.

[functions.process-location-check]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.verify-account]
verify_jwt = true

# verification-media: signierte URLs fuer Verifizierungs-Videos (nur Admin).
# Gateway-Pruefung zusaetzlich zur manuellen is_admin-Pruefung in der
# Function selbst (Defense-in-Depth).
[functions.verification-media]
verify_jwt = true

[functions.server-time]
# Muss anonym aufrufbar sein, da die App beim Start (vor Login) die
# Serverzeit synchronisieren möchte. Die Funktion gibt nur die aktuelle
# ISO-Zeit zurück – keine personenbezogenen Daten.
verify_jwt = false

[functions.ice-config]
verify_jwt = true

[functions.prekeys]
verify_jwt = true

[functions.send-bug-report]
verify_jwt = true
enabled = true

# --- Edge Functions OHNE JWT-Verifikation ---
# check-location: wird INTERN von process-location-check via x-internal-secret aufgerufen
# (eigene Auth im Code). verify_jwt auf Gateway-Ebene wuerde interne Calls blockieren.
[functions.check-location]
verify_jwt = false

# send-confirmation-email: wird von Supabase Auth als Hook aufgerufen (eigenes Secret)
[functions.send-confirmation-email]
verify_jwt = false

# confirm: oeffentliche Landing-Page fuer E-Mail-Bestaetigung
[functions.confirm]
verify_jwt = false

# captcha-page: laedt das CAPTCHA-Widget (Turnstile/hCaptcha) auf der
# Projekt-Domain - Anbieter validieren den Hostnamen, about:blank wird
# abgelehnt. Enthaelt KEINE Secrets (Sitekey ist oeffentlich).
[functions.captcha-page]
verify_jwt = false

# notify-user: eigene Auth im Code (internes Trigger-Secret ODER User-JWT
# bei Client-Aufrufen). Gateway-JWT-Pruefung ist deshalb deaktiviert.
[functions.notify-user]
verify_jwt = false

# request-unban: Entsperrungsantrag fuer gesperrte E-Mail-Adressen.
# Der Nutzer ist bewusst NICHT eingeloggt (Konto gesperrt) -> verify_jwt
# deaktiviert. Eigene Absicherung in der Funktion: nur Eintraege aus
# banned_emails werden akzeptiert, IP-Rate-Limit (5/h) + persistente
# Rate-Limits pro E-Mail (3/h via consume_rate_limit).
[functions.request-unban]
verify_jwt = false
enabled = true

# --- Passkeys (WebAuthn) ---
# Aktiviert Passkey-Login/Registrierung in Supabase Auth. Die nativen Apps
# (Android/iOS) sind über assetlinks.json / apple-app-site-association mit
# der RP-Domain auth.wispdating.de verknüpft (siehe passkey-assets/).
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Wisp"
rp_id = "auth.wispdating.de"
# RP-Origins: HTTPS-Origin der RP-Domain + Android-App-Origin.
# Den Android-Teil durch den BASE64(SHA256 deines Signing-Zertifikats)
# ersetzen (siehe passkey-assets/README.md, Abschnitt 2/4).
# WICHTIG (Fix Passkey-Fehler): Der bisherige Hash N6pPbMHeuPWVdF6sCs4KGclUcoD8dI8CZr3S7HvpVXI
# passte zu KEINEM aktuellen Keystore. Korrekt sind (BASE64URL(SHA-1)):
#   - Upload/Release-Key (wisp-upload.keystore): eCBZhrV1MwP5k7i2doyQajeNoMg
#   - Debug-Keystore (flutter run/Emulator):     gSZ8R1GNUntkLo4WCNPgAYShA9g
# BEI SUPABASE CLOUD: Werte zusätzlich/zuständig im DASHBOARD pflegen
# (Authentication -> WebAuthn/Passkeys -> Origins)!
rp_origins = [
  "https://auth.wispdating.de",
  "android:apk-key-hash:eCBZhrV1MwP5k7i2doyQajeNoMg",
  "android:apk-key-hash:gSZ8R1GNUntkLo4WCNPgAYShA9g",
]
