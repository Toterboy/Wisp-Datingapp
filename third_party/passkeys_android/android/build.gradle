group 'com.corbado.passkeys_android'
version '1.0-SNAPSHOT'

// Lokaler Fork (third_party/passkeys_android, Basis 2.13.1):
// Keine KGP-Apply-Zeile mehr. Das Plugin enthaelt AUSSCHLIESSLICH Java-
// Quellen - das Upstream-Buildfile zog trotzdem bedingungslos kotlin-android
// an, was die Flutter-KGP-Warnung ("plugins that apply KGP") ausloeste.
// Der Flutter-Plugin-Loader wendet KGP selbst an (android.builtInKotlin=false);
// mit Built-in Kotlin kompiliert AGP selbst. Beides funktioniert ohne die
// Apply-Zeile, da kein Kotlin-Code kompiliert werden muss.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.corbado.passkeys_android'
    }

    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 23
        multiDexEnabled true
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation("androidx.credentials:credentials:1.6.0")

    // optional - needed for credentials support from play services, for devices running
    // Android 13 and below.0
    implementation("androidx.credentials:credentials-play-services-auth:1.6.0")
    implementation 'com.google.android.gms:play-services-auth:20.5.0'
    implementation 'com.google.android.gms:play-services-fido:20.0.1'
    implementation 'androidx.multidex:multidex:2.0.1'
}
