group 'net.wolverinebeach.flutter_timezone'
version '1.0-SNAPSHOT'

// Lokaler Fork (third_party/flutter_timezone):
// Kein eigener buildscript/AGP-KGP-Klasspath mehr und KEINE KGP-Apply-Zeile.
// Der Flutter-Plugin-Loader wendet KGP für dieses Plugin selbst an
// (android.builtInKotlin=false); mit Built-in Kotlin (AGP 9, Flag true)
// kompiliert AGP die Kotlin-Quellen selbst.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'net.wolverinebeach.flutter_timezone'
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
